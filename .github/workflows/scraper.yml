name: Scraper Workflow

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM
  workflow_dispatch:      # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maxun
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build server
        run: npm run build:server

      - name: Run scraper
        env:
          MAXUN_API_KEY: ${{ secrets.MAXUN_API_KEY }}
          MAXUN_BACKEND_URL: ${{ secrets.MAXUN_BACKEND_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          ROBOT_ID: ${{ secrets.ROBOT_ID }}
        run: node server/dist/server/src/scripts/run-scraper.js